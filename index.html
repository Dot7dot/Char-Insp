<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色靈感庫 Char-Insp</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- 左側：角色資料夾列表 -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <h1 class="brand">角色靈感庫</h1>
        <button id="btn-export" class="btn btn-ghost" type="button" title="匯出 JSON / CSV / 圖片 ZIP">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
          匯出
        </button>
      </header>

      <button id="btn-new" class="btn btn-primary btn-block" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        新增角色資料夾
      </button>

      <input id="search" class="search" type="search" placeholder="搜尋角色名稱…" autocomplete="off">

      <ul id="folder-list" class="folder-list" aria-label="角色資料夾"></ul>
      <p id="folder-count" class="folder-count"></p>

      <div class="backup-box">
        <div class="backup-actions">
          <button id="btn-backup" class="btn btn-ghost" type="button" title="把所有角色與圖片打包成一個備份檔">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7m16 0-2-3H6L4 7m16 0H4m8 4v6m0 0-3-3m3 3 3-3"/></svg>
            完整備份
          </button>
          <button id="btn-restore" class="btn btn-ghost" type="button" title="從備份檔還原">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7m16 0-2-3H6L4 7m16 0H4m8 10v-6m0 0-3 3m3-3 3 3"/></svg>
            匯入還原
          </button>
        </div>
        <p id="backup-status" class="backup-status"></p>
      </div>
    </aside>

    <!-- 右側：角色內容 -->
    <main id="editor" class="editor" aria-live="polite"></main>
  </div>

  <!-- 空狀態 -->
  <template id="tpl-empty">
    <div class="empty">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <h2>還沒有選擇角色</h2>
      <p>點左邊的「新增角色資料夾」建立第一個角色，或從列表中選一個。</p>
    </div>
  </template>

  <!-- 角色編輯畫面 -->
  <template id="tpl-editor">
    <div class="editor-inner">
      <header class="editor-header">
        <div class="editor-title">
          <svg class="folder-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <h2 data-bind="title"></h2>
        </div>
        <div class="editor-actions">
          <span class="save-state" data-bind="saveState"></span>
          <button class="btn btn-danger-ghost" type="button" data-action="delete">刪除角色</button>
        </div>
      </header>

      <section class="card">
        <h3 class="card-title">基本資料</h3>
        <div class="grid-2">
          <label class="field">
            <span class="field-label">Name <small>名稱</small></span>
            <input type="text" data-field="name" placeholder="例如：艾莉絲" maxlength="120">
          </label>
          <label class="field">
            <span class="field-label">English Name <small>英文名稱</small></span>
            <input type="text" data-field="englishName" placeholder="e.g. Alice" maxlength="120">
          </label>
        </div>
        <label class="field">
          <span class="field-label">Description <small>描述</small></span>
          <textarea data-field="description" rows="5" placeholder="個性、背景故事、外觀特徵、能力……"></textarea>
        </label>
      </section>

      <section class="card">
        <h3 class="card-title">圖片</h3>
        <div class="gallery" data-image="icon">
          <div class="gallery-head">
            <span class="field-label">Icon <small>小標誌</small></span>
            <span class="badge" data-bind="count"></span>
          </div>
          <div class="gallery-grid gallery-icon" data-bind="grid"></div>
        </div>
        <div class="gallery" data-image="head">
          <div class="gallery-head">
            <span class="field-label">Head <small>大頭照</small></span>
            <span class="badge" data-bind="count"></span>
          </div>
          <div class="gallery-grid gallery-head-grid" data-bind="grid"></div>
        </div>
        <div class="gallery" data-image="picture">
          <div class="gallery-head">
            <span class="field-label">Picture <small>角色詳細圖</small></span>
            <span class="badge" data-bind="count"></span>
          </div>
          <div class="gallery-grid gallery-picture" data-bind="grid"></div>
        </div>
        <p class="hint">每一類都可以上傳多張。點「＋」或把圖片拖曳進來（可一次選多張）；點縮圖可放大檢視。支援 PNG / JPG / GIF / WebP / SVG。</p>
      </section>

      <section class="card">
        <h3 class="card-title">Dialogue <small>對話</small> <span class="badge" data-bind="dialogueCount"></span></h3>
        <ol class="dialogue-list" data-bind="dialogueList"></ol>
        <div class="dialogue-add">
          <textarea data-bind="dialogueInput" rows="2" placeholder="輸入一句新對話… (Ctrl / ⌘ + Enter 快速新增)"></textarea>
          <button class="btn btn-primary" type="button" data-action="add-dialogue">新增對話</button>
        </div>
      </section>
    </div>
  </template>

  <!-- 匯出視窗 -->
  <dialog id="export-dialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h2>匯出角色資料</h2>

      <fieldset class="choice-group">
        <legend>匯出範圍</legend>
        <label class="choice">
          <input type="radio" name="scope" value="all" checked>
          <span><strong>全部角色</strong> <small data-bind="countAll"></small></span>
        </label>
        <label class="choice">
          <input type="radio" name="scope" value="current">
          <span><strong>目前選擇的角色</strong> <small data-bind="currentName"></small></span>
        </label>
      </fieldset>

      <fieldset class="choice-group">
        <legend>文字資料 <small>（Name、English Name、Description、Dialogue，不含圖片）</small></legend>
        <label class="choice">
          <input type="radio" name="text" value="json" checked>
          <span>
            <strong>JSON</strong>
            <small>適合直接匯入遊戲引擎，保留完整結構</small>
          </span>
        </label>
        <label class="choice">
          <input type="radio" name="text" value="csv">
          <span>
            <strong>CSV</strong>
            <small>適合用 Excel / Google 試算表檢視、整理</small>
          </span>
        </label>
        <label class="choice">
          <input type="radio" name="text" value="none">
          <span>
            <strong>不匯出文字</strong>
            <small>只下載圖片 ZIP</small>
          </span>
        </label>
      </fieldset>

      <fieldset class="choice-group">
        <legend>圖片</legend>
        <label class="check">
          <input type="checkbox" name="images">
          <span>
            <span>同時匯出圖片（ZIP） <small data-bind="imageCount"></small></span>
            <small>每個角色一個資料夾，內含 icon / head / picture 子資料夾。</small>
          </span>
        </label>
      </fieldset>

      <p class="dialog-error" data-bind="error" hidden></p>

      <menu class="dialog-actions">
        <button class="btn btn-ghost" value="cancel" type="submit">取消</button>
        <button class="btn btn-primary" type="button" data-action="confirm-export">匯出</button>
      </menu>
    </form>
  </dialog>

  <!-- 匯入還原視窗 -->
  <dialog id="restore-dialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h2>匯入還原</h2>

      <dl class="summary">
        <div><dt>備份檔</dt><dd data-bind="fileName"></dd></div>
        <div><dt>備份時間</dt><dd data-bind="createdAt"></dd></div>
        <div><dt>內容</dt><dd data-bind="contents"></dd></div>
      </dl>

      <fieldset class="choice-group" data-bind="modes">
        <legend>還原方式</legend>
        <label class="choice">
          <input type="radio" name="mode" value="merge" checked>
          <span>
            <strong>合併（建議）</strong>
            <small>保留目前的角色；備份裡相同的角色會換成備份的版本，其餘新增進來。</small>
          </span>
        </label>
        <label class="choice">
          <input type="radio" name="mode" value="replace">
          <span>
            <strong>全部取代</strong>
            <small>還原後資料會和備份完全一樣，<b>備份裡沒有的角色會被刪除</b>（目前 <span data-bind="currentCount"></span> 個角色）。</small>
          </span>
        </label>
      </fieldset>

      <p class="dialog-progress" data-bind="progress" hidden></p>
      <p class="dialog-error" data-bind="error" hidden></p>

      <menu class="dialog-actions">
        <button class="btn btn-ghost" value="cancel" type="submit" data-action="cancel">取消</button>
        <button class="btn btn-primary" type="button" data-action="confirm-restore">開始還原</button>
      </menu>
    </form>
  </dialog>

  <!-- 圖片檢視 -->
  <dialog id="viewer" class="viewer" aria-label="圖片檢視">
    <div class="viewer-bar">
      <span class="viewer-name" data-bind="name"></span>
      <button class="viewer-close" type="button" data-action="close" aria-label="關閉">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <img data-bind="img" alt="">
  </dialog>

  <input id="file-input" type="file" accept="image/*" multiple hidden>
  <input id="backup-input" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/db.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/export.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
